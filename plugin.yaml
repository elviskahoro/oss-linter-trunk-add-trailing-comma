version: 0.1

tools:
  definitions:
    - name: add-trailing-comma
      runtime: python
      package: add-trailing-comma
      shims: [add-trailing-comma]
      known_good_version: 4.0.0

lint:
  definitions:
    - name: add-trailing-comma
      files: [python]
      description: Adds trailing commas to Python multi-line collections and call sites
      tools: [add-trailing-comma]
      suggest_if: files_present
      known_good_version: 4.0.0
      commands:
        - name: format
          output: rewrite
          run: add-trailing-comma ${target}
          success_codes: [0, 1]
          batch: true
          in_place: true
          formatter: true
          cache_results: true
